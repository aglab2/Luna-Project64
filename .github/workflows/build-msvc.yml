name: Build PJ64

on:
  push:
    branches:
      - Release
  pull_request:
    branches:
      - Release

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive
      
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1

    - name: Build Solution
      run: msbuild Project64.sln /p:Configuration=Release

    - name: Build Solution
      run: msbuild Project64.sln /p:Configuration=Release-Clang

    - name: Archive Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-output
        path: |
          **/Bin/Release/**
          **/Bin/Release-Clang/**
